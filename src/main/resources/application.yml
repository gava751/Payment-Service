spring:
  profiles:
    default: local

  application:
    name: payment-service

  data:
    mongodb:
      auto-index-creation: false
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/payment_service}

  liquibase:
    change-log: classpath:db/changelog/master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8084}

app:
  services:
    random-number-url: ${RANDOM_NUMBER_URL:https://www.random.org/integers/?num=1&min=0&max=1000&col=1&base=10&format=plain&rnd=new}
    connect-timeout: ${RANDOM_NUMBER_CONNECT_TIMEOUT:2s}
    read-timeout: ${RANDOM_NUMBER_READ_TIMEOUT:5s}
  kafka:
    topics:
      payment-events: ${PAYMENT_EVENTS_TOPIC:payment-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
