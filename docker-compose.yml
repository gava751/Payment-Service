services:
  app:
    build: .
    container_name: payment-service-app
    depends_on:
      payment-mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_URI: mongodb://${MONGO_USER:?MONGO_USER is not set}:${MONGO_PASSWORD:?MONGO_PASSWORD is not set}@payment-mongo:27017/${MONGO_DB:?MONGO_DB is not set}?authSource=admin
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-mongo:
    image: mongo:8.0
    container_name: payment-service-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is not set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is not set}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
